services:
  - type: web
    name: ev-ai-backend
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: OPENROUTER_API_KEY
        sync: false # Set in Render Environment Dashboard
      - key: OPENAI_API_KEY
        sync: false # Set in Render Environment Dashboard (Optional)
      - key: GEMINI_API_KEY
        sync: false # Set in Render Environment Dashboard (Optional)
      - key: GROK_API_KEY
        sync: false # Set in Render Environment Dashboard (Optional)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false # Set in Render Environment Dashboard
      - key: SUPABASE_ANON_KEY
        sync: false # Set in Render Environment Dashboard
